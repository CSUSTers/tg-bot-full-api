[package]
name = "tg-bot-full-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.6", features = ["macros", "multipart"] }
axum-extra = { version = "0.12.1", features = ["async-read-body", "routing", "typed-header"] }
clap = { version = "4.5.52", features = ["derive", "env"] }
clap_derive = "4.5.18"
reqwest = { version = "0.12.24", features = ["stream"], default-features = false }
tokio = { version = "1.48.0", features = ["full"] }
